name: TOPIX Proxy History One-Off

on:
  push:
    paths:
      - .github/workflows/topix-proxy-fetch-once.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch TOPIX ETF proxy daily history
        run: |
          python - <<'PY'
          import datetime as dt, json, requests
          p1=int(dt.datetime(2025,12,20,tzinfo=dt.timezone.utc).timestamp())
          p2=int(dt.datetime(2026,8,15,tzinfo=dt.timezone.utc).timestamp())
          symbol='1306.T'
          url=f'https://query1.finance.yahoo.com/v8/finance/chart/{symbol}?period1={p1}&period2={p2}&interval=1d&events=div%2Csplits&includeAdjustedClose=true'
          r=requests.get(url,timeout=45,headers={'User-Agent':'Mozilla/5.0'}); r.raise_for_status()
          result=r.json()['chart']['result'][0]; ts=result.get('timestamp') or []
          q=((result.get('indicators') or {}).get('quote') or [{}])[0]
          adj=(((result.get('indicators') or {}).get('adjclose') or [{}])[0].get('adjclose') or [])
          at=lambda xs,i: xs[i] if i<len(xs) else None
          rows=[{'date':dt.datetime.fromtimestamp(t,tz=dt.timezone.utc).date().isoformat(),'open':at(q.get('open') or [],i),'high':at(q.get('high') or [],i),'low':at(q.get('low') or [],i),'close':at(q.get('close') or [],i),'adjclose':at(adj,i),'volume':at(q.get('volume') or [],i)} for i,t in enumerate(ts)]
          out={'TOPIX_PROXY':{'status':'OK','symbol':symbol,'name':'NEXT FUNDS TOPIX ETF','rows':rows,'url':url}}
          open('topix_proxy.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False))
          print('rows',len(rows),'last',rows[-1] if rows else None)
          PY
      - name: Upload benchmark
        uses: actions/upload-artifact@v4
        with:
          name: topix-proxy-history-2026
          path: topix_proxy.json
          retention-days: 1
