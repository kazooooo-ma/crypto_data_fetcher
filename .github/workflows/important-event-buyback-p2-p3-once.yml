name: Important Event Buyback P2 P3 One-Off

on:
  push:
    paths:
      - '.github/workflows/important-event-buyback-p2-p3-once.yml'

permissions:
  contents: read

jobs:
  extract:
    name: extract-${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: 2025h1
            start: '2025-01-01'
            end: '2025-06-30'
          - id: 2025h2
            start: '2025-07-01'
            end: '2025-12-31'
          - id: 2026h1
            start: '2026-01-01'
            end: '2026-06-30'
          - id: 2026h2
            start: '2026-07-01'
            end: '2026-08-12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pymupdf
      - name: Extract buyback fields
        run: >-
          python scripts/important_event_buyback_p2_p3_once.py extract
          --start ${{ matrix.start }} --end ${{ matrix.end }}
          --out out/${{ matrix.id }} --workers 12
      - uses: actions/upload-artifact@v4
        with:
          name: buyback-part-${{ matrix.id }}
          path: out/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 1

  aggregate:
    name: aggregate-lifecycles
    needs: extract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pymupdf
      - uses: actions/download-artifact@v4
        with:
          pattern: buyback-part-*
          path: parts
          merge-multiple: false
      - name: Link lifecycle and run regression
        run: python scripts/important_event_buyback_p2_p3_once.py aggregate --parts parts --out out/aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: important-event-buyback-p2-p3
          path: out/aggregate/
          if-no-files-found: error
          retention-days: 1
