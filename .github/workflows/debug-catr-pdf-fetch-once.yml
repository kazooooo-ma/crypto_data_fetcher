name: Debug CATR PDF Fetch One-Off

on:
  push:
    paths:
      - '.github/workflows/debug-catr-pdf-fetch-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python scripts/debug_catr_pdf_fetch_once.py
      - uses: actions/upload-artifact@v4
        with:
          name: debug-catr-pdf-fetch
          path: out/debug-catr-pdf/
          if-no-files-found: error
          retention-days: 1
