name: Backlog History Collection V3 Publish One-Off

on:
  push:
    paths:
      - '.github/workflows/backlog-history-collection-v3-publish-once.yml'

permissions:
  contents: write

jobs:
  collect:
    name: collect-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pymupdf beautifulsoup4
      - name: Collect and parse quarterly history
        run: >-
          python scripts/backlog_history_collection_v3.py collect
          --shard ${{ matrix.shard }} --shards 6
          --out out/shard-${{ matrix.shard }} --workers 10
      - uses: actions/upload-artifact@v4
        with:
          name: backlog-history-v3-publish-part-${{ matrix.shard }}
          path: out/shard-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 1

  aggregate:
    name: aggregate-reconcile-and-publish
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pymupdf beautifulsoup4
      - uses: actions/download-artifact@v4
        with:
          pattern: backlog-history-v3-publish-part-*
          path: parts
          merge-multiple: false
      - name: Aggregate and reconcile
        run: >-
          python scripts/backlog_history_collection_v3.py aggregate
          --parts parts --out out/aggregate
      - name: Package audit result
        run: |
          mkdir -p tmp
          cd out/aggregate
          zip -9 -r ../../tmp/backlog-history-v3-results.zip .
          cd ../..
          cp out/aggregate/summary.json tmp/backlog-history-v3-summary.json
          cp out/aggregate/reconciliation.csv tmp/backlog-history-v3-reconciliation.csv
      - name: Commit result files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp/backlog-history-v3-results.zip tmp/backlog-history-v3-summary.json tmp/backlog-history-v3-reconciliation.csv
          git commit -m 'Publish backlog history v3 audit results' || exit 0
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: backlog-history-collection-v3-published
          path: out/aggregate/
          if-no-files-found: error
          retention-days: 1
