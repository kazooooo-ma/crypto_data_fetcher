name: TDnet Backfill One-Off

on:
  push:
    paths:
      - .github/workflows/tdnet-backfill-once.yml
      - scripts/tdnet_backfill_fetch_once.py
      - scripts/backfill_price_codes.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF text tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Install Python dependency
        run: python -m pip install requests

      - name: Fetch TDnet PDFs, extract text, and obtain prices
        run: python scripts/tdnet_backfill_fetch_once.py

      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: tdnet-backfill-source-2026-jan-feb
          path: out
          retention-days: 1
          if-no-files-found: error
