name: Important Event Migration Inventory 2025 One-Off

on:
  push:
    paths:
      - '.github/workflows/important-event-migration-inventory-2025-once.yml'

permissions:
  contents: read

jobs:
  inventory_2025:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Build 2025 mechanical-event inventory from JSON API
        run: python scripts/important_event_migration_inventory_2025_yanoshin.py
      - name: Upload inventory bundle
        uses: actions/upload-artifact@v4
        with:
          name: important-event-migration-inventory-2025-yanoshin-v2
          path: out_important_event_inventory_2025/
          if-no-files-found: error
          retention-days: 1
