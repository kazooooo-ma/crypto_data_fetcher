name: Order Backlog Daily Live Scan One-Off

on:
  push:
    paths:
      - '.github/workflows/debug-yanoshin-json-once.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pymupdf
      - run: python scripts/order_backlog_daily_live_scan_once.py
      - uses: actions/upload-artifact@v4
        with:
          name: order-backlog-daily-20260813
          path: out/order_backlog_20260813/
          if-no-files-found: error
          retention-days: 1
