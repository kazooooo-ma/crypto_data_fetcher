name: CATR PDF Access Probe One-Off

on:
  push:
    paths:
      - '.github/workflows/catr-pdf-access-probe-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: python scripts/catr_pdf_access_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: catr-pdf-access-probe
          path: out/catr-pdf-access-probe/
          if-no-files-found: error
          retention-days: 1
