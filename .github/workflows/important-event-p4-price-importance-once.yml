name: Important Event P4 Price Importance V2 One-Off

on:
  push:
    paths:
      - '.github/workflows/important-event-p4-price-importance-once.yml'

permissions:
  actions: read
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Download financing lifecycle artifact
        uses: actions/download-artifact@v4
        with:
          name: important-event-financing-p2-p3-archive
          path: inputs/financing
          repository: kazooooo-ma/crypto_data_fetcher
          run-id: 31693251013
          github-token: ${{ github.token }}
      - name: Download buyback extraction parts
        uses: actions/download-artifact@v4
        with:
          pattern: buyback-v3-part-*
          path: inputs/buyback
          merge-multiple: false
          repository: kazooooo-ma/crypto_data_fetcher
          run-id: 31688337183
          github-token: ${{ github.token }}
      - name: Evaluate price liquidity and importance v2
        run: python scripts/run_important_event_p4_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: important-event-p4-price-importance-v2
          path: out/p4/
          if-no-files-found: error
          retention-days: 1
