name: Backlog V22 History V2 One-Off

on:
  push:
    paths:
      - '.github/workflows/backlog-v22-history-v2-once.yml'

permissions:
  contents: read

jobs:
  extract:
    name: history-${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: y2021, start: '2021-01-01', end: '2021-12-31' }
          - { id: y2022, start: '2022-01-01', end: '2022-12-31' }
          - { id: y2023, start: '2023-01-01', end: '2023-12-31' }
          - { id: y2024, start: '2024-01-01', end: '2024-12-31' }
          - { id: y2025, start: '2025-01-01', end: '2025-12-31' }
          - { id: y2026, start: '2026-01-01', end: '2026-08-12' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pymupdf
      - name: Reconstruct quarterly backlog history
        run: >-
          python scripts/run_backlog_v22_history_5digit.py segment
          --start ${{ matrix.start }} --end ${{ matrix.end }}
          --out out/${{ matrix.id }} --workers 12
      - uses: actions/upload-artifact@v4
        with:
          name: backlog-v22-v2-part-${{ matrix.id }}
          path: out/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 1

  aggregate:
    needs: extract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pymupdf
      - uses: actions/download-artifact@v4
        with:
          pattern: backlog-v22-v2-part-*
          path: parts
          merge-multiple: false
      - run: python scripts/backlog_v22_history_once.py aggregate --parts parts --out out/aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: backlog-v22-history-v2-aggregate
          path: out/aggregate/
          if-no-files-found: error
          retention-days: 1
