name: TOPIX History One-Off

on:
  push:
    paths:
      - .github/workflows/topix-fetch-once.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch TOPIX daily history
        run: |
          python - <<'PY'
          import datetime as dt, json, requests
          p1=int(dt.datetime(2025,12,20,tzinfo=dt.timezone.utc).timestamp())
          p2=int(dt.datetime(2026,8,15,tzinfo=dt.timezone.utc).timestamp())
          symbol='998405.T'
          url=f'https://query1.finance.yahoo.com/v8/finance/chart/{symbol}?period1={p1}&period2={p2}&interval=1d&events=div%2Csplits&includeAdjustedClose=true'
          response=requests.get(url,timeout=45,headers={'User-Agent':'Mozilla/5.0'})
          response.raise_for_status()
          obj=response.json(); result=obj['chart']['result'][0]
          timestamps=result.get('timestamp') or []
          q=(result.get('indicators',{}).get('quote') or [{}])[0]
          adj=((result.get('indicators',{}).get('adjclose') or [{}])[0].get('adjclose') or [])
          rows=[]
          for i,ts in enumerate(timestamps):
              at=lambda xs: xs[i] if i<len(xs) else None
              rows.append({'date':dt.datetime.fromtimestamp(ts,tz=dt.timezone.utc).date().isoformat(),'open':at(q.get('open') or []),'high':at(q.get('high') or []),'low':at(q.get('low') or []),'close':at(q.get('close') or []),'adjclose':at(adj),'volume':at(q.get('volume') or [])})
          out={'TOPIX':{'status':'OK','symbol':symbol,'rows':rows,'url':url}}
          with open('topix_prices.json','w',encoding='utf-8') as f: json.dump(out,f,ensure_ascii=False)
          print('rows',len(rows),'last',rows[-1] if rows else None)
          PY
      - name: Upload TOPIX history
        uses: actions/upload-artifact@v4
        with:
          name: topix-history-2026
          path: topix_prices.json
          retention-days: 1
