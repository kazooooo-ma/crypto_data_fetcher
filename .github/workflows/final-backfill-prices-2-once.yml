name: Final Backfill Prices 2 One-Off
on:
  push:
    paths:
      - scripts/final_backfill_price_fetch_2.py
      - .github/workflows/final-backfill-prices-2-once.yml
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python scripts/final_backfill_price_fetch_2.py
      - uses: actions/upload-artifact@v4
        with:
          name: final-backfill-prices-3
          path: out_final_prices_2
          retention-days: 1
