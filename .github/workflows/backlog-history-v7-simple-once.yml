name: Backlog History V7 Simple One-Off

on:
  push:
    paths:
      - '.github/workflows/backlog-history-v7-simple-once.yml'

permissions:
  contents: read

jobs:
  collect-and-aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pymupdf beautifulsoup4
      - name: Collect six shards
        run: |
          mkdir -p parts
          python scripts/backlog_history_collection_v7.py collect --shard 0 --shards 6 --out parts/part-0 --workers 10 &
          python scripts/backlog_history_collection_v7.py collect --shard 1 --shards 6 --out parts/part-1 --workers 10 &
          python scripts/backlog_history_collection_v7.py collect --shard 2 --shards 6 --out parts/part-2 --workers 10 &
          python scripts/backlog_history_collection_v7.py collect --shard 3 --shards 6 --out parts/part-3 --workers 10 &
          python scripts/backlog_history_collection_v7.py collect --shard 4 --shards 6 --out parts/part-4 --workers 10 &
          python scripts/backlog_history_collection_v7.py collect --shard 5 --shards 6 --out parts/part-5 --workers 10 &
          wait
      - name: Aggregate and reconcile
        run: python scripts/backlog_history_collection_v7.py aggregate --parts parts --out out/aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: backlog-history-collection-v7
          path: out/aggregate/
          if-no-files-found: error
          retention-days: 1
