name: Backlog Parser V7 Quick Regression One-Off

on:
  push:
    paths:
      - '.github/workflows/backlog-parser-regression-v7-quick-once.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pymupdf beautifulsoup4
      - run: python scripts/backlog_parser_regression_v7_quick.py
      - uses: actions/upload-artifact@v4
        with:
          name: backlog-parser-regression-v7-quick
          path: out/backlog-parser-regression-v7-quick/
          if-no-files-found: error
          retention-days: 1
