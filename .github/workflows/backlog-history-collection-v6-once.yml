name: Backlog History Collection V6 One-Off

on:
  push:
    paths:
      - '.github/workflows/backlog-history-collection-v6-once.yml'

permissions:
  contents: read

jobs:
  collect:
    name: collect-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pymupdf beautifulsoup4
      - name: Collect and parse historical quarters
        run: >-
          python scripts/backlog_history_collection_v6.py collect
          --shard ${{ matrix.shard }} --shards 6
          --out out/part-${{ matrix.shard }} --workers 10
      - uses: actions/upload-artifact@v4
        with:
          name: backlog-history-v6-part-${{ matrix.shard }}
          path: out/part-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 1

  aggregate:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pymupdf beautifulsoup4
      - uses: actions/download-artifact@v4
        with:
          pattern: backlog-history-v6-part-*
          path: parts
          merge-multiple: false
      - name: Aggregate and reconcile
        run: >-
          python scripts/backlog_history_collection_v6.py aggregate
          --parts parts --out out/aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: backlog-history-collection-v6
          path: out/aggregate/
          if-no-files-found: error
          retention-days: 1
