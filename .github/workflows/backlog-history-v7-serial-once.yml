name: Backlog History V7 Serial One-Off

on:
  push:
    paths:
      - '.github/workflows/backlog-history-v7-serial-once.yml'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pymupdf beautifulsoup4
      - name: Collect all companies with bounded concurrency
        run: python scripts/backlog_history_collection_v7.py collect --shard 0 --shards 1 --out parts/part-0 --workers 4
      - name: Aggregate and reconcile
        run: python scripts/backlog_history_collection_v7.py aggregate --parts parts --out out/aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: backlog-history-collection-v7-serial
          path: out/aggregate/
          if-no-files-found: error
          retention-days: 1
