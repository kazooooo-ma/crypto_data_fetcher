name: Final Backfill Prices One-Off

on:
  push:
    paths:
      - scripts/final_backfill_price_fetch.py
      - .github/workflows/final-backfill-prices-once.yml

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Fetch missing price histories
        run: python scripts/final_backfill_price_fetch.py
      - name: Upload price bundle
        uses: actions/upload-artifact@v4
        with:
          name: final-backfill-prices-2026
          path: out_final_prices
          retention-days: 1
