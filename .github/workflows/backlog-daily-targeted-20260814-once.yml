name: Backlog Daily Targeted 2026-08-14 One-Off
on:
  push:
    paths:
      - '.github/workflows/backlog-daily-targeted-20260814-once.yml'
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pymupdf
      - run: python scripts/backlog_daily_targeted_20260814.py
      - uses: actions/upload-artifact@v4
        with:
          name: backlog-daily-targeted-20260814
          path: out/targeted-20260814/
          if-no-files-found: error
          retention-days: 2
