name: Backlog Daily Scan 2026-08-14 One-Off

on:
  push:
    paths:
      - '.github/workflows/backlog-daily-scan-20260814-once.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pymupdf
      - name: Scan all recent earnings disclosures
        run: >-
          python scripts/backlog_daily_scan_once.py
          --start 2026-08-08 --end 2026-08-14
          --out out --workers 20
      - uses: actions/upload-artifact@v4
        with:
          name: backlog-daily-20260814
          path: out/
          if-no-files-found: error
          retention-days: 2
