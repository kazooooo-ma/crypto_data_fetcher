name: Important Event Migration Inventory 2026 JSON One-Off

on:
  push:
    paths:
      - '.github/workflows/important-event-migration-inventory-2026-json-once.yml'

permissions:
  contents: read

jobs:
  inventory_2026:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Build 2026 mechanical-event inventory from JSON API
        run: |
          sed \
            -e 's/START = dt.date(2025, 1, 1)/START = dt.date(2026, 1, 1)/' \
            -e 's/END = dt.date(2025, 12, 31)/END = dt.date(2026, 8, 12)/' \
            -e 's/out_important_event_inventory_2025/out_important_event_inventory_2026/g' \
            -e 's/candidates_2025/candidates_2026/g' \
            -e 's/monthly_summary_2025/monthly_summary_2026/g' \
            -e 's/page_audit_2025/page_audit_2026/g' \
            -e 's/summary_2025/summary_2026/g' \
            scripts/important_event_migration_inventory_2025_yanoshin.py > /tmp/important_event_inventory_2026.py
          python /tmp/important_event_inventory_2026.py
      - name: Upload inventory bundle
        uses: actions/upload-artifact@v4
        with:
          name: important-event-migration-inventory-2026-json
          path: out_important_event_inventory_2026/
          if-no-files-found: error
          retention-days: 1
