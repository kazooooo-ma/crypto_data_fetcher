name: TDnet Full Backfill 2026 One-Off

on:
  push:
    paths:
      - scripts/tdnet_backfill_full_2026_once.py
      - scripts/tdnet_backfill_full_trigger.txt
      - .github/workflows/tdnet-backfill-full-2026-once.yml

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF text tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install Python dependency
        run: python -m pip install --upgrade requests
      - name: Fetch TDnet documents and prices
        run: python scripts/tdnet_backfill_full_2026_once.py
      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: tdnet-backfill-full-2026-source
          path: out_full
          if-no-files-found: error
          retention-days: 1
