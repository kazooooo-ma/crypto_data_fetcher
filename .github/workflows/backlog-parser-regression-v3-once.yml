name: Backlog Parser V3 Regression One-Off

on:
  push:
    paths:
      - '.github/workflows/backlog-parser-regression-v3-once.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pymupdf beautifulsoup4
      - name: Run parser v3 regression
        run: python scripts/backlog_parser_regression.py
      - uses: actions/upload-artifact@v4
        with:
          name: backlog-parser-regression-v3
          path: out/backlog-parser-regression-v3/
          if-no-files-found: error
          retention-days: 1
