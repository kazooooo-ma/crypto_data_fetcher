name: Backlog Inventory Debug One-Off

on:
  push:
    paths:
      - '.github/workflows/backlog-inventory-debug-once.yml'

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pymupdf beautifulsoup4
      - run: python scripts/backlog_inventory_debug.py
      - uses: actions/upload-artifact@v4
        with:
          name: backlog-inventory-debug
          path: inventory-debug.json
          if-no-files-found: error
          retention-days: 1
